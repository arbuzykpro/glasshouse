name: build

# Lets you trigger a run by hand from the Actions tab, which is how you'll
# use this — the signed build only produces a real .ipa on a manual run.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — always runs, costs nothing, needs no secrets.
  # Generates the Xcode project and COMPILES every line of Swift.
  # This is the part GitHub gives away free on a public repo.
  # ---------------------------------------------------------------------
  verify:
    name: Verify it compiles
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Show the resolved build settings (debugging aid)
        run: |
          xcodebuild -project Glasshouse.xcodeproj -scheme Glasshouse \
            -showBuildSettings 2>/dev/null | grep -Ei "PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET" || true

      # Simulator build needs no signing and no Apple ID at all, so this
      # compiles the app + the widget extension with zero configuration.
      - name: Compile for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Glasshouse.xcodeproj \
            -scheme Glasshouse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/compile.log

      # A failed Swift error gets buried in 4000 lines of xcodebuild noise.
      # Fail fast with just the lines that matter.
      - name: Surface any Swift errors
        if: failure()
        run: |
          echo "---- errors ----"
          grep -E "error:|warning: .*never used|BUILD FAILED" build/compile.log | head -60 || true

      - name: Package the simulator build
        if: success()
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "built: $APP"
          # -c -k --keepParent makes a zip that survives symlinks inside .app,
          # which plain `zip` mangles.
          ditto -c -k --keepParent "$APP" Glasshouse-simulator.zip

      - name: Upload the simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Glasshouse-simulator-zip
          path: Glasshouse-simulator.zip
          retention-days: 14

  # ---------------------------------------------------------------------
  # Job 2 — manual runs only, and only meaningful once you've added the
  # signing secrets. Produces a real .ipa your iPhone will accept.
  # Skips itself (green, in ~5s) when the secrets are absent, so the repo
  # stays useful before you pay for anything.
  # ---------------------------------------------------------------------
  signed-ipa:
    name: Build installable .ipa
    runs-on: macos-15
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # Secrets are NOT available in a job-level `if:`, so the check has to
      # happen in a step and gate everything after it.
      - name: Are the signing secrets present?
        id: sig
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$TEAM" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets found. Skipping the .ipa build. See SIGNING.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop here if not configured
        if: steps.sig.outputs.present != 'true'
        run: exit 0

      # A throwaway keychain, so the runner's login keychain stays clean and
      # the cert never persists between runs.
      - name: Create a temporary keychain
        if: steps.sig.outputs.present == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      - name: Import your certificate
        if: steps.sig.outputs.present == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -A
          # Without the partition list, codesign on the runner can't see the
          # private key and the archive fails with errSecInternalComponent.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install your provisioning profile
        if: steps.sig.outputs.present == 'true'
        env:
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

      # Automatic signing can't authenticate headlessly, so the archive has to
      # use manual signing with the profile name we control.
      - name: Archive
        if: steps.sig.outputs.present == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Glasshouse.xcodeproj \
            -scheme Glasshouse \
            -configuration Release \
            -archivePath build/Glasshouse.xcarchive \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee build/archive.log

      - name: Write the export options
        if: steps.sig.outputs.present == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          # Keys are bundle IDs, values are profile names. BOTH the app and the
          # widget extension need entries, or exportArchive refuses.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>            <string>development</string>
              <key>teamID</key>            <string>${TEAM}</string>
              <key>signingStyle</key>      <string>manual</string>
              <key>compileBitcode</key>    <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.example.glasshouse</key>        <string>${PROFILE_NAME}</string>
                  <key>com.example.glasshouse.widgets</key> <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export the .ipa
        if: steps.sig.outputs.present == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Glasshouse.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export 2>&1 | tee build/export.log
          ls -la build/export

      - name: Upload the .ipa
        if: steps.sig.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Glasshouse-ipa
          path: build/export/*.ipa
          retention-days: 30

      - name: Delete the keychain anyway
        if: always()
        run: security delete-keychain build.keychain || true
